<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trailhead Coffee, checkout</title>
<style>body{font-family:system-ui,sans-serif;max-width:420px;margin:40px auto;padding:0 16px;color:#222}h1{font-size:22px}.row{display:flex;justify-content:space-between;margin:8px 0}button{padding:8px 14px}#total{font-weight:700}</style></head>
<body>
<h1>Trailhead Coffee</h1>
<div class="row"><span>House blend, 12 oz</span><span>$18.00</span></div>
<div class="row"><label for="qty">Quantity</label><input id="qty" type="number" min="1" value="1" style="width:60px"></div>
<div class="row"><span>Subtotal</span><span id="subtotal">$18.00</span></div>
<div class="row"><span>Total</span><span id="total">$18.00</span></div>
<button id="pay">Pay</button>
<p id="status" role="status"></p>
<script src="app.js"></script>
</body></html>
